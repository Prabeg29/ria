name: Build and Push to Artifact Registry 

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: resume-intelligence-api-502806
  GAR_LOCATION: australia-southeast1
  REPOSITORY: resume-intelligence-api
  SERVICE: ria

jobs:
  build-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v0'
        with:
          credentials_json: '${{ secrets.SA_CREDENTIALS }}'
          token_format: 'access_token'

      # Authenticate Docker to Google Cloud Artifact Registry
      - name: Docker Auth
        id: docker-auth
        uses: 'docker/login-action@v1'
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.SA_CREDENTIALS }}

      - name: Build and Push Container
        run: |
          docker build --target runner -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}" ./
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
